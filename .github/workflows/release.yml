name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build binaries
      run: |
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o shared-ip-linux-amd64 .
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o shared-ip-linux-arm64 .

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          shared-ip-linux-amd64
          shared-ip-linux-arm64
        generate_release_notes: true
